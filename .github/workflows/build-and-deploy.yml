name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - app/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: devops-bootcamp/final-project-syedazam

jobs:
  build:
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image tag
        id: tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: app
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.value }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          build-args: |
            VITE_CALLSIGN=syedazam
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run the deploy playbook on the controller
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail

          instance_id=$(aws ec2 describe-instances \
            --filters Name=tag:Role,Values=controller Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          echo "Controller: $instance_id"

          command_id=$(aws ssm send-command \
            --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $IMAGE_TAG" \
            --timeout-seconds 900 \
            --parameters "commands=[\"sudo -u ubuntu -H bash -lc 'cd ~/final-project-example && git pull --ff-only && cd ansible && ansible-playbook playbooks/web.yml -e image_tag=$IMAGE_TAG'\"]" \
            --query 'Command.CommandId' --output text)
          echo "Command: $command_id"

          for _ in $(seq 1 180); do
            sleep 5
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$instance_id" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$instance_id" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Status: $status"
          test "$status" = "Success"
